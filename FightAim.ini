; Fight Aim - v1.0.0 - Mysterdogg
; Configuration file for FightAim.cs
; Any missing key falls back to its default value.
; (November 2026).

[General]
Version=1.0.0
; Master switch. Enabled by default, use 0 to disable it.
AZ5=1
; Short status text when the game starts and when this file is reloaded. Disabled by default, use 1 to enable it.
ShowStatus=0
; Key for relaoding the INI in-game. F10 (121) by default. Uses Windows virtual-key codes, in DECIMAL. 
; Set key to 0 to disable it.
ReloadKey=121

[FightAim]
; How close a ped must be to start the lock, in meters. 5.0 by default.
Radius=5.0
; 0 = drop the lock as soon as no ped is within Radius.
; 1 = Stay locked while the button is held, even if the ped dies or walks away.
HoldLock=1
; 0 = vanilla.
; 1 = shown while locked without the fade out when the lock ends. By default.
; 2 = disables the lock-on marker entirely.
HideMarker=1
